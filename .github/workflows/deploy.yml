name: CI/CD Pipeline & Automated Testing

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build_and_test:
    name: 🧪 Kiểm Thử & Biên Dịch Mã Nguồn
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🏗️ Verify Production Build (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://gqfopvgtrfezvtcadpyc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxZm9wdmd0cmZlenZ0Y2FkcHljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODM1MTQsImV4cCI6MjEwMjA1OTUxNH0.is272jaLWbcRQvJHco-eNn-kanhAYFcXRrc3wUTyrjc' }}

  notify_status:
    name: 📢 Thông Báo Kết Quả (Telegram / Email)
    needs: build_and_test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📲 Send Telegram Notification (Optional)
        continue-on-error: true
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *THÔNG BÁO CI/CD DỰ ÁN KHO TRÒ CHƠI HỌC TẬP THCS*
            
            📌 *Repository:* `${{ github.repository }}`
            👤 *Tác giả:* `${{ github.actor }}`
            🌿 *Branch/Tag:* `${{ github.ref_name }}`
            
            ✅ *Kết quả Biên dịch:* `${{ needs.build_and_test.result == 'success' && 'THÀNH CÔNG 🎉' || 'THẤT BẠI ❌' }}`
            🔗 *Commit:* `${{ github.sha }}`

      - name: ✉️ Send Email Notification (Optional)
        continue-on-error: true
        if: ${{ secrets.MAIL_SERVER != '' && secrets.MAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[CI/CD Result] Kho Trò Chơi Học Tập THCS - Build ${{ needs.build_and_test.result }}"
          body: |
            Xin chào Admin!
            
            Hệ thống CI/CD vừa hoàn thành kiểm thử tự động cho dự án Kho Trò Chơi Học Tập THCS GDPT 2018.
            - Kết quả: ${{ needs.build_and_test.result }}
            - Repository: ${{ github.repository }}
            - Commit ID: ${{ github.sha }}
            - Tác giả: ${{ github.actor }}
            
            Trân trọng,
            Hệ thống GitHub Actions Auto Bot.
          to: lyngangiang83pt@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
